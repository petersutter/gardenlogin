name: publish-to-package-repositories

permissions: {}

on:
  workflow_call:
    inputs:
      component-descriptor:
        type: string
        required: true
        description: |
          the OCM-Component-Descriptor from which to publish built artefacts

  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
        description: |
          The version tag for the release (e.g. v1.2.3).

          Required if `component-descriptor`-input is not provided; ignored otherwise (
          version is read from component-descriptor in this case).
      component-descriptor:
        description: |
          The Component-Descriptor from which to read the artefact-digests
          Hint: component-descriptor can be retrieved, for example:
          - as (GitHub) release-asset from existing releases
          - as GitHub-Actions-Artifact (also from non-release-builds)
        type: string
      dry_run:
        description: "Dry run: disable external actions (no uploads/dispatches)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-digests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read-digests.outputs.version || steps.export-version.outputs.version }}
      darwin_sha_amd64: ${{ steps.read-digests.outputs.DARWIN_SHA_AMD64 || steps.dummy-hashes.outputs.DARWIN_SHA_AMD64 }}
      darwin_sha_arm64: ${{ steps.read-digests.outputs.DARWIN_SHA_ARM64 || steps.dummy-hashes.outputs.DARWIN_SHA_ARM64 }}
      linux_sha_amd64: ${{ steps.read-digests.outputs.LINUX_SHA_AMD64 || steps.dummy-hashes.outputs.LINUX_SHA_AMD64 }}
      linux_sha_arm64: ${{ steps.read-digests.outputs.LINUX_SHA_ARM64 || steps.dummy-hashes.outputs.LINUX_SHA_ARM64 }}
      windows_sha: ${{ steps.read-digests.outputs.WINDOWS_SHA || steps.dummy-hashes.outputs.WINDOWS_SHA }}

    steps:
      - uses: gardener/cc-utils/.github/actions/trusted-checkout@v1 # zizmor: ignore[unpinned-uses] -- same-org action; intentionally allowed for now, planned to pin to a version in the future

      - name: Export version from input
        id: export-version
        if: ${{ inputs.version != '' && inputs.component-descriptor == '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Read digests from component-descriptor
        id: read-digests
        if: ${{ inputs.component-descriptor != '' }}
        env:
          COMPONENT_DESCRIPTOR: ${{ inputs.component-descriptor }}
        run: |
          set -euo pipefail

          printenv COMPONENT_DESCRIPTOR > /tmp/component-descriptor.yaml

          source .github/workflows/export-digests-from-component-descriptor.sh \
            /tmp/component-descriptor.yaml

          echo "DARWIN_SHA_AMD64=${DARWIN_SHA_AMD64}" >> "${GITHUB_OUTPUT}"
          echo "DARWIN_SHA_ARM64=${DARWIN_SHA_ARM64}" >> "${GITHUB_OUTPUT}"
          echo "LINUX_SHA_AMD64=${LINUX_SHA_AMD64}" >> "${GITHUB_OUTPUT}"
          echo "LINUX_SHA_ARM64=${LINUX_SHA_ARM64}" >> "${GITHUB_OUTPUT}"
          echo "WINDOWS_SHA=${WINDOWS_SHA}" >> "${GITHUB_OUTPUT}"

          version="$(yq '.component.version' /tmp/component-descriptor.yaml)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Use dummy hashes (manual run without component-descriptor)
        id: dummy-hashes
        if: ${{ inputs.component-descriptor == '' }}
        run: |
          set -euo pipefail
          dummy=dummySHA256sum
          printf '%s\n' \
            "DARWIN_SHA_AMD64=$dummy" \
            "DARWIN_SHA_ARM64=$dummy" \
            "LINUX_SHA_AMD64=$dummy"  \
            "LINUX_SHA_ARM64=$dummy"  \
            "WINDOWS_SHA=$dummy" >> "$GITHUB_OUTPUT"

  update-homebrew:
    needs: resolve-digests
    if: ${{ inputs.dry_run != true }}
    uses: gardener/homebrew-tap/.github/workflows/update-package.yaml@master # FORK-TEST: change to petersutter/homebrew-tap
    with:
      component: gardenlogin
      tag: ${{ needs.resolve-digests.outputs.version }}
      darwin_sha_amd64: ${{ needs.resolve-digests.outputs.darwin_sha_amd64 }}
      darwin_sha_arm64: ${{ needs.resolve-digests.outputs.darwin_sha_arm64 }}
      linux_sha_amd64: ${{ needs.resolve-digests.outputs.linux_sha_amd64 }}
      linux_sha_arm64: ${{ needs.resolve-digests.outputs.linux_sha_arm64 }}

  update-chocolatey:
    needs: resolve-digests
    if: ${{ inputs.dry_run != true }}
    uses: gardener/chocolatey-packages/.github/workflows/update-package.yaml@master # FORK-TEST: change to petersutter/chocolatey-packages
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    with:
      component: gardenlogin
      tag: ${{ needs.resolve-digests.outputs.version }}
      windows_sha: ${{ needs.resolve-digests.outputs.windows_sha }}
      push_to_chocolatey: true
